services:
  db:
    image: postgres:16
    container_name: dtp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:19.0
    container_name: dtp_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8071:8071"
      - "8072:8072"
    # environment:
    #   HOST: db
    #   PORT: 5432
    #   USER: ${POSTGRES_USER:-odoo}
    #   PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./19.0/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./dtp_addons:/mnt/extra-addons

volumes:
  postgres-data:
  odoo-data:
