services:
  db:
    image: postgres:16
    container_name: dtp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: ./19.0
      dockerfile: Dockerfile
    container_name: dtp_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8071:8071"
      - "8072:8072"
    # environment:
    #   HOST: db
    #   PORT: 5432
    #   USER: ${POSTGRES_USER:-odoo}
    #   PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./dtp_addons:/mnt/extra-addons

volumes:
  postgres-data:
  odoo-data:
